[project]
name = "forge-ai-orchestrator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "gitpython>=3.2.0",
    "langchain>=1.4.4",
    "langgraph>=1.2.14",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
forge-ai-orchestrator = "forge_ai_orchestrator:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
